<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zahra Paramedical</title>
<style>body{font-family:sans-serif;background:#f5f7fb;margin:0}header{background:#0d47a1;color:#fff;padding:20px;text-align:center}main{max-width:800px;margin:20px auto;background:#fff;padding:20px;border-radius:12px} .btn{background:#0d47a1;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;display:inline-block}</style>
</head>
<body>
<header><h1>Zahra Paramedical Institute</h1><p>Official Student Verification</p></header>
<main><h2>Welcome</h2><a class="btn" href="verify.html">Verify Certificate</a><div id="list"></div></main>
<script>fetch('students.json').then(r=>r.json()).then(d=>{let h='<h3>Students</h3>';d.forEach(s=>{h+=`<p>${s.id} - ${s.name} - <a href="verify.html?id=${s.id}">Verify</a></p>`});document.getElementById('list').innerHTML=h})</script>
</body>
</html>
