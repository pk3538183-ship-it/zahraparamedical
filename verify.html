<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Verify</title><style>body{font-family:sans-serif;background:#eef2f7;margin:0}header{background:#0d47a1;color:#fff;padding:16px;text-align:center}main{max-width:600px;margin:30px auto;background:#fff;padding:24px;border-radius:12px;text-align:center}input{padding:12px;width:80%}.ok{color:green;font-weight:bold;font-size:22px}.fail{color:red}</style></head><body><header><h2>Verification</h2></header><main><input id="sid" placeholder="Enter ID"><br><button onclick="check()" style="margin-top:10px;padding:12px 20px;background:#0d47a1;color:#fff;border:none;border-radius:8px">Verify</button><div id="result"></div></main><script>function getParam(){return new URLSearchParams(location.search).get('id')}function render(s){if(!s){document.getElementById('result').innerHTML='<p class=fail>Not Found</p>';return;}document.getElementById('result').innerHTML=`<p class=ok>Verified</p><p>${s.name} - ${s.course}</p>`}function check(){let id=document.getElementById('sid').value.trim()||getParam();fetch('students.json').then(r=>r.json()).then(d=>{let f=d.find(x=>x.id==id);render(f)})}window.onload=()=>{let p=getParam();if(p){document.getElementById('sid').value=p;check()}}</script></body></html>
