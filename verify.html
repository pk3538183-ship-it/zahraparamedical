<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zahra Diploma</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>body{font-family:Arial;background:#eef7f6;margin:0;padding:10px}.box{background:#fff;max-width:500px;margin:20px auto;padding:20px;border-radius:15px;text-align:center;box-shadow:0 2px 10px #0002}input{padding:12px;width:80%;border:2px solid teal;border-radius:25px;text-align:center}button{padding:12px 30px;background:teal;color:#fff;border:none;border-radius:25px;font-weight:bold;margin-top:10px}#cert{display:none;margin-top:20px}.c{width:700px;background:#fffde7;border:10px solid #0d4f4f;padding:20px;text-align:center;margin:auto}.line{border-bottom:1px solid #000;min-width:250px;display:inline-block;font-weight:bold}</style></head><body>
<div class="box">
<h2 style="color:teal;margin:0">ZAHRA PARAMEDICAL</h2>
<p>Certificate Verification</p>
<input id="cid" placeholder="ZPC-001"><br>
<button onclick="verify()">VERIFY & SHOW DIPLOMA</button>
<p id="msg" style="color:red;font-weight:bold"></p>
</div>
<div id="cert"><div class="c" id="certificate">
<h2>ZAHRA PARAMEDICAL COURSES</h2><h3 style="color:#8a6d3b">DIPLOMA CERTIFICATE</h3>
<p>Student: <span id="n" class="line"></span></p>
<p>Father: <span id="f" class="line"></span></p>
<p>Course: <span id="co" class="line"></span></p>
<p style="margin-top:20px"><b>ID:</b> <span id="i"></span> | <b>Date:</b> <span id="d"></span></p>
<p style="color:green;font-weight:bold;margin-top:20px">✅ VERIFIED - Online Record Found</p>
</div><br><button onclick="download()" style="background:green">📥 Download</button></div>
<script>
let students=[
{id:"ZPC-001",name:"Sheeraz Bhatti",father:"Ahmed Khan",course:"Nursing Assistant",date:"15-May-2026"},
{id:"ZPC-002",name:"Maeraj Ali",father:"Shahzad",course:"OT Technician",date:"15-May-2026"},
{id:"ZPC-003",name:"Aqib Gilal",father:"Mukhtiar Ahmed",course:"Dispenser",date:"15-May-2026"}
];
function verify(){
let id=document.getElementById('cid').value.trim().toUpperCase();
let s=students.find(x=>x.id==id);
if(!id){document.getElementById('msg').innerText="ID likho";return;}
if(!s){document.getElementById('msg').innerText="❌ "+id+" Not Found";document.getElementById('cert').style.display="none";return;}
document.getElementById('msg').innerText="";
document.getElementById('n').innerText=s.name;
document.getElementById('f').innerText=s.father;
document.getElementById('co').innerText=s.course;
document.getElementById('i').innerText=s.id;
document.getElementById('d').innerText=s.date;
document.getElementById('cert').style.display="block";
}
function download(){html2canvas(document.getElementById('certificate')).then(c=>{let a=document.createElement('a');a.download=document.getElementById('i').innerText+'.jpg';a.href=c.toDataURL();a.click();});}
</script></body></html>
